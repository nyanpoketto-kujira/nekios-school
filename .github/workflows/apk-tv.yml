name: Build APK TV

# Workflow darurat satu job: build APK release universal (semua ABI)
# untuk Smart TV Android, dari branch mana pun yang dipilih saat
# dispatch. Sengaja terpisah dari build.yml supaya dispatch-nya
# TIDAK ikut membangun job lain (Windows/Linux/APK emulator).
#
# Dibuat 2026-11-26 atas perintah nyanpo: PC acara bermasalah,
# display pindah ke Smart TV.

on:
  workflow_dispatch:

jobs:
  build-apk-tv:
    name: Build APK TV (release, universal)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Cache pub get
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK release (universal — arm64, armv7, x86_64)
        run: flutter build apk --release

      - name: Upload APK TV artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekios-school-apk-tv
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
